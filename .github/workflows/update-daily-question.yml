name: Update daily question

on:
  schedule:
    # 01:30 JST, well after kanteilog.com publishes the previous day's data
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and add yesterday's question
        id: fetch
        run: node scripts/update-daily-question.mjs

      - name: Commit and push if a question was added
        if: steps.fetch.outputs.wrote == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/questions
          git commit -m "chore: add question for ${{ steps.fetch.outputs.date }}"
          git push
