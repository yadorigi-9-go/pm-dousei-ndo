name: Update daily question

on:
  schedule:
    # 07:30 JST — kanteilog.com updates its data around 07:00 JST
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch and add yesterday's question
        id: fetch
        run: node scripts/update-daily-question.mjs

      - name: Commit, open PR, and merge if a question was added
        if: steps.fetch.outputs.wrote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.fetch.outputs.date }}"
          BRANCH="auto/question-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/questions
          git commit -m "chore: add question for ${DATE}"
          # force-push in case a previous failed run left this date's branch behind
          git push --force origin "$BRANCH"
          gh pr create --title "chore: add question for ${DATE}" --body "scripts/update-daily-question.mjs による自動追加" --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch
          # Merges made with GITHUB_TOKEN don't trigger push workflows,
          # so start the deploy explicitly (workflow_dispatch is exempt).
          gh workflow run deploy.yml --ref main
